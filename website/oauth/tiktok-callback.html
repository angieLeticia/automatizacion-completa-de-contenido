<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TikTok OAuth callback</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    line-height: 1.6;
    color: #222;
    background: #f7f7f7;
  }
  header {
    padding: 40px 20px;
    text-align: center;
    background: #111;
    color: white;
  }
  header h1 { margin: 0; font-size: 28px; }
  main {
    max-width: 700px;
    margin: 30px auto;
    padding: 0 20px;
  }
  section {
    background: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 10px;
  }
  .warning {
    background: #fff3cd;
    border: 1px solid #ffe69c;
    color: #664d03;
    padding: 15px;
    border-radius: 8px;
    font-weight: bold;
  }
  .token-box {
    word-break: break-all;
    background: #f0f0f0;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 12px;
    font-family: monospace;
    font-size: 13px;
    user-select: all;
    margin: 15px 0;
  }
  button {
    background: #0057b8;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #004591; }
  .status-ok { color: #146c2e; font-weight: bold; }
  .status-empty { color: #444; font-weight: bold; }
  .status-error { color: #a12622; font-weight: bold; }
  .error-box {
    word-break: break-word;
    background: #fdecea;
    border: 1px solid #f5c2c0;
    border-radius: 6px;
    padding: 12px;
    font-family: monospace;
    font-size: 13px;
    margin: 15px 0;
  }
  .copy-feedback { margin-left: 10px; font-size: 14px; color: #146c2e; }
  .hint { color: #555; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <h1>TikTok OAuth callback</h1>
    <p>Shows the authorization code for server-side exchange.</p>
  </header>

  <main>
    <section id="result-section">
      <p id="status-line">Procesando respuesta...</p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      // Extraccion de parametros del FRAGMENT — TikTok no usa flujo implicito
      // (siempre devuelve el authorization code por query string, nunca un
      // access_token por el fragmento), pero se conserva el mismo parseo
      // defensivo que callback.html (Meta) por si algún día hiciera falta —
      // inofensivo si nunca hay nada que leer aquí.
      function parseFragmentParams(hash) {
        var result = {};
        var raw = hash.indexOf("#") === 0 ? hash.slice(1) : hash;
        if (!raw) return result;
        var pairs = raw.split("&");
        for (var i = 0; i < pairs.length; i++) {
          var pair = pairs[i];
          if (!pair) continue;
          var eqIdx = pair.indexOf("=");
          var key, value;
          if (eqIdx === -1) {
            key = pair;
            value = "";
          } else {
            key = pair.slice(0, eqIdx);
            value = pair.slice(eqIdx + 1);
          }
          try {
            key = decodeURIComponent(key);
          } catch (e) {}
          try {
            value = decodeURIComponent(value);
          } catch (e) {}
          result[key] = value;
        }
        return result;
      }

      var fragmentParams = parseFragmentParams(window.location.hash);
      var accessToken = fragmentParams["access_token"] || null;
      var fragmentState = fragmentParams["state"] || null;

      // El authorization `code` de TikTok llega por QUERY STRING (?code=...),
      // igual que Meta — mismo parseo, sin cambios de lógica.
      var searchParams = new URLSearchParams(window.location.search);
      var authCode = searchParams.get("code");
      var queryState = searchParams.get("state");
      var state = fragmentState || queryState;

      // TikTok devuelve estos parámetros (ninguno es sensible: son
      // códigos/descripciones de error públicos, no credenciales) cuando el
      // usuario deniega el permiso o hay un problema de configuración, en vez
      // de "code". Se revisan AMBAS fuentes (query string Y fragmento) por el
      // mismo motivo que callback.html.
      var errorCode = searchParams.get("error") || fragmentParams["error"] || null;
      var errorReason = searchParams.get("error_reason") || fragmentParams["error_reason"] || null;
      var errorDescription = searchParams.get("error_description") || fragmentParams["error_description"] || null;
      var errorCodeNumeric = searchParams.get("error_code") || fragmentParams["error_code"] || null;

      // Limpieza INMEDIATA de fragmento Y query string de la URL/historial -
      // antes de construir cualquier interfaz, para minimizar el tiempo que
      // el token/code permanecen visibles en la barra de direcciones o en el
      // historial del navegador.
      if (window.location.hash || window.location.search) {
        window.history.replaceState(null, "", window.location.pathname);
      }

      var section = document.getElementById("result-section");

      function el(tag, attrs, children) {
        var node = document.createElement(tag);
        if (attrs) {
          for (var k in attrs) {
            if (Object.prototype.hasOwnProperty.call(attrs, k)) {
              if (k === "text") {
                node.textContent = attrs[k];
              } else {
                node.setAttribute(k, attrs[k]);
              }
            }
          }
        }
        if (children) {
          for (var i = 0; i < children.length; i++) node.appendChild(children[i]);
        }
        return node;
      }

      section.innerHTML = "";

      // Reutilizable para access_token (fragmento) y code (query string) -
      // misma interfaz de advertencia + caja copiable + botón, sin duplicar
      // lógica. NUNCA hace red, NUNCA guarda nada - solo muestra en pantalla.
      function renderSensitiveValue(statusText, value, buttonLabel) {
        section.appendChild(el("p", { class: "status-ok", text: statusText }));
        section.appendChild(
          el("p", {
            class: "warning",
            text: "Este valor es sensible. No lo compartas públicamente ni lo pegues en chats. Esta página no lo almacena ni lo envía a ningún servidor.",
          })
        );
        section.appendChild(el("div", { class: "token-box", text: value }));

        var copyRow = el("div", {});
        var copyBtn = el("button", { type: "button", text: buttonLabel });
        var feedback = el("span", { class: "copy-feedback" });
        copyRow.appendChild(copyBtn);
        copyRow.appendChild(feedback);
        section.appendChild(copyRow);

        copyBtn.addEventListener("click", function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(value).then(
              function () {
                feedback.textContent = "Copiado.";
              },
              function () {
                feedback.textContent = "No se pudo copiar automáticamente - selecciona el texto manualmente.";
              }
            );
          } else {
            feedback.textContent = "Copia no disponible en este navegador - selecciona el texto manualmente.";
          }
        });

        section.appendChild(el("p", { class: "hint", text: "Después de copiarlo, guárdalo localmente fuera del repositorio." }));
      }

      var somethingReceived = false;

      // Rama de error, ANTES de code/access_token: si TikTok devolvió un
      // error, se muestra claramente en vez de (o además de) cualquier otra
      // cosa. Solo texto NO sensible - sin caja "copiable sensible", sin
      // guardar nada en localStorage/sessionStorage/cookies/backend.
      if (errorCode) {
        somethingReceived = true;
        section.appendChild(el("p", { class: "status-error", text: "TikTok devolvió un error - no se recibió ningún code." }));
        var errorLines = ["error: " + errorCode];
        if (errorReason) errorLines.push("error_reason: " + errorReason);
        if (errorCodeNumeric) errorLines.push("error_code: " + errorCodeNumeric);
        if (errorDescription) errorLines.push("error_description: " + errorDescription);
        section.appendChild(el("div", { class: "error-box", text: errorLines.join("\n") }));
        section.appendChild(
          el("p", { class: "hint", text: "Esto no es un secreto - es la respuesta pública de TikTok explicando por qué no se emitió un code (ej. permiso denegado, configuración de la app)." })
        );
      }

      if (authCode) {
        somethingReceived = true;
        renderSensitiveValue("Código de autorización recibido correctamente.", authCode, "Copiar code");
      }

      if (accessToken) {
        somethingReceived = true;
        renderSensitiveValue("Token recibido correctamente.", accessToken, "Copiar token");
      }

      if (state) {
        section.appendChild(el("p", { class: "hint", text: "state recibido: " + state }));
      }

      if (!somethingReceived) {
        section.appendChild(el("p", { class: "status-empty", text: "No se recibió ningún access_token ni código de autorización." }));
      }
    })();
  </script>
</body>
</html>
